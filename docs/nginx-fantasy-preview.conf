server {
    listen 80;
    server_name fantasy-preview.example.com;

    root /var/www/fantasy-dashboard-preview;
    index index.html;

    auth_basic "Fantasy Dashboard Preview";
    auth_basic_user_file /etc/nginx/.htpasswd-fantasy-preview;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /404.html {
        internal;
    }
}
