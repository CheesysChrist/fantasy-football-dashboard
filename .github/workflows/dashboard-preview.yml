name: dashboard-preview

on:
  push:
    branches:
      - feat/sleeper-waivers-adapter
      - fix/ci-private-pages-and-pnpm
      - main
  pull_request:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Angular unit tests
        run: pnpm nx test fantasy-angular

      - name: Build production dashboard bundle
        run: pnpm nx build fantasy-angular --configuration=production

      - name: Run dashboard preview E2E
        run: pnpm nx run fantasy-angular-e2e:e2e

      - name: Upload dashboard preview screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview-screenshot
          path: |
            apps/fantasy-angular-e2e/test-results/dashboard-preview.png
            apps/fantasy-angular-e2e/apps/fantasy-angular-e2e/test-results/dashboard-preview.png
          if-no-files-found: warn

      - name: Upload dashboard preview Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview-report
          path: |
            apps/fantasy-angular-e2e/test-output/playwright/report
            .nx/cache/*/apps/fantasy-angular-e2e/test-output/playwright/report
          if-no-files-found: warn

      - name: Upload dashboard production bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-production-bundle
          path: dist/apps/fantasy-angular/browser
          if-no-files-found: warn
