name: dashboard-preview

on:
  push:
    branches:
      - feat/sleeper-waivers-adapter
      - main
  pull_request:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Angular unit tests
        run: pnpm nx test fantasy-angular

      - name: Run dashboard preview E2E
        run: pnpm nx run fantasy-angular-e2e:e2e

      - name: Upload dashboard preview artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview
          path: |
            apps/fantasy-angular-e2e/test-results/dashboard-preview.png
          if-no-files-found: warn
